# Release extras: checksums, a web bundle, and release notes that say something.
#
# The build itself lives in the shared app-builder kit, and a fix there reaches
# every repository at once — right for the build, wrong for the three things only
# this repository knows: which assets to describe, what its changelog says about
# this version, and what belongs in a hand-carry zip.
#
# This workflow waits for the build of the same commit to finish, then adds them
# to the same rolling release. It never builds, never deploys, never deletes.
#
# Why it waits instead of being triggered by the build: `workflow_run` did not
# fire for this repository, and the release event cannot help either — the build
# edits the release with the repository's own GITHUB_TOKEN, and GitHub suppresses
# the events that token creates. Polling the run list is the one signal that
# cannot be swallowed.
#
# SPDX-FileCopyrightText: 2026 Dr Sohil Momin
# SPDX-License-Identifier: PolyForm-Noncommercial-1.0.0

name: Release extras

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: release-extras
  cancel-in-progress: true

jobs:
  extras:
    name: Checksums, web bundle, notes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # was @v4

      - name: Wait for this commit's build
        id: wait
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          for i in $(seq 1 60); do
            read -r status conclusion sha <<<"$(gh run list --repo "$GITHUB_REPOSITORY" \
              --workflow "Build + deploy" --limit 1 --json status,conclusion,headSha \
              --jq '.[0] | "\(.status) \(.conclusion // "-") \(.headSha)"')"
            if [ "$sha" != "$GITHUB_SHA" ]; then
              echo "newest build is for ${sha:0:7}, not ${GITHUB_SHA:0:7} - waiting"
            elif [ "$status" = "completed" ]; then
              echo "build for ${GITHUB_SHA:0:7}: $conclusion"
              if [ "$conclusion" != "success" ]; then
                echo "SKIP=1" >> "$GITHUB_ENV"
                echo "::notice::the build did not succeed - leaving the previous release alone"
              fi
              exit 0
            else
              echo "build is $status"
            fi
            sleep 15
          done
          echo "SKIP=1" >> "$GITHUB_ENV"
          echo "::warning::no completed build for ${GITHUB_SHA:0:7} after 15 minutes"

      - name: The release we are decorating
        if: env.SKIP != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view app-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice::no app-latest release yet - nothing to decorate"
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi

      - name: Checksums of what was published
        if: env.SKIP != '1'
        env:
          GH_TOKEN: ${{ github.token }}
          APP: bmi-bmr-tdee-macros-fluid-calculator
        run: |
          set -euo pipefail
          mkdir -p dist
          # only the three built assets: not our own previous SHA256SUMS or zip
          gh release download app-latest --repo "$GITHUB_REPOSITORY" --dir dist --clobber \
            --pattern "${APP}-portable.exe" --pattern "${APP}.apk" --pattern "${APP}-linux"
          ( cd dist && sha256sum "${APP}-portable.exe" "${APP}.apk" "${APP}-linux" > SHA256SUMS.txt )
          cat dist/SHA256SUMS.txt

      - name: A bundle that works from a USB stick
        if: env.SKIP != '1'
        run: |
          set -euo pipefail
          APP=bmi-bmr-tdee-macros-fluid-calculator
          rm -rf web && mkdir -p web
          cp index.html LICENSE README.md web/
          cp docs/play/manifest.webmanifest docs/play/sw.js docs/play/icon.svg \
             docs/play/icon-192.png docs/play/icon-512.png web/
          ( cd web && zip -q -r "../dist/${APP}-web.zip" . )
          unzip -l "dist/${APP}-web.zip"

      - name: Release notes from the changelog
        if: env.SKIP != '1'
        run: |
          set -euo pipefail
          python3 scripts/release_notes.py > notes.md
          head -20 notes.md

      - name: Attach them to the release
        if: env.SKIP != '1'
        env:
          GH_TOKEN: ${{ github.token }}
          APP: bmi-bmr-tdee-macros-fluid-calculator
        run: |
          set -euo pipefail
          gh release upload app-latest --repo "$GITHUB_REPOSITORY" --clobber \
            dist/SHA256SUMS.txt "dist/${APP}-web.zip"
          gh release edit app-latest --repo "$GITHUB_REPOSITORY" --notes-file notes.md
          echo "### Extras added to app-latest" >> "$GITHUB_STEP_SUMMARY"
          cat dist/SHA256SUMS.txt >> "$GITHUB_STEP_SUMMARY"
