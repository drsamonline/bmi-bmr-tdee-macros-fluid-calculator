name: Test

# The app carries its own known-value self-tests; this runs them headlessly on
# every push, so a change that breaks a calculator is caught immediately.

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # was @v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020   # was @v4
        with:
          node-version: "20"
      - run: npm install
      # The self-test drives the BUILT page (index.html at the repo root), which
      # `npm run build` writes from src/. Without this step the suite died on
      # ENOENT: no such file or directory, open '.../index.html' - red on every
      # push since the build artefact stopped being committed, testing nothing.
      - run: npm run build
      - run: npm test
