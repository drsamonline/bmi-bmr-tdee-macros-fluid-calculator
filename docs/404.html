<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 — Page not found · Clinical Health Calculator</title>
<meta name="description" content="The page you were looking for was not found. Return to the Clinical Health Calculator landing page or open the live calculator.">
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#f6f1e7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12161a" media="(prefers-color-scheme: dark)">
<link rel="icon" href="/bmi-bmr-tdee-macros-fluid-calculator/play/icon.svg" type="image/svg+xml">
<style>
:root{
  --paper:#f6f1e7;--paper-2:#fffdf7;--ink:#191c1e;--muted:#6f6a60;--rule:#dcd2c0;--amber:#a2660f;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
  --mono:ui-monospace,"JetBrains Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root{--paper:#12161a;--paper-2:#171c21;--ink:#f2ece1;--muted:#9a938a;--rule:#2b333a;--amber:#e8b04b}
}
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;
  background:var(--paper);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
}
.card{
  max-width:560px;width:100%;background:var(--paper-2);border:1px solid var(--rule);
  border-radius:6px;padding:44px 40px;text-align:center;
}
.code{
  font-family:var(--serif);font-size:74px;line-height:1;letter-spacing:-.02em;color:var(--amber);
}
h1{font-family:var(--serif);font-weight:400;font-size:24px;margin:14px 0 10px}
p{color:var(--muted);font-size:15px;margin:0 0 26px}
.btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
a.btn{
  display:inline-flex;align-items:center;gap:8px;text-decoration:none;font-weight:600;
  font-size:14.5px;padding:11px 18px;border-radius:3px;border:1px solid transparent;
}
.primary{background:var(--ink);color:var(--paper)}
.ghost{border-color:var(--rule);color:var(--ink)}
.hint{font-family:var(--mono);font-size:11.5px;color:var(--muted);margin:22px 0 0}
</style>
</head>
<body>
  <main class="card">
    <div class="code">404</div>
    <h1>Page not found</h1>
    <p>That page isn't here. The landing page and the calculator are both one tap away.</p>
    <div class="btns">
      <a class="btn primary" href="/bmi-bmr-tdee-macros-fluid-calculator/">Landing page</a>
      <a class="btn ghost" href="/bmi-bmr-tdee-macros-fluid-calculator/play/">Open the calculator</a>
    </div>
    <p class="hint">BMI · BMR · TDEE · macros · fluids — offline, one HTML file</p>
  </main>
</body>
</html>
